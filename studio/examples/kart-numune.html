<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;background:#F4EFE6;font-family:"DejaVu Sans",sans-serif;overflow:hidden}
.t{position:absolute;top:290px;left:60px;right:120px;font-size:104px;font-weight:800;line-height:1.1;color:#111}
.pill{display:inline-block;background:#1DB954;color:#fff;border-radius:999px;padding:6px 34px;font-style:italic}
.card{position:absolute;left:90px;right:150px;top:760px;height:520px;border-radius:44px;background:#111;color:#fff;font-size:60px;display:flex;align-items:center;justify-content:center;text-align:center}
</style></head><body>
<div class="t">Kağız menyu<br><span class="pill">köhnəldi</span></div>
<div class="card" id="c">QR oxut · menyu açılsın<br>ə ş ç ğ ı ö ü ₼</div>
<script>
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
window.seek=t=>{const k=ease((t-0.3)/0.6);const c=document.getElementById('c');c.style.transform=`translateY(${(1-k)*300}px)`;c.style.opacity=k;c.style.filter=`blur(${(1-k)*18}px)`;};
</script></body></html>
