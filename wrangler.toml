# Cloudflare-dəki Worker adı ilə eyni olmalıdır (Workers Builds preview bu ada görə hədəfi tapır).
name = "jarvis-avtomat"
main = "worker.js"
compatibility_date = "2026-09-01"

# Secrets (ANTHROPIC_API_KEY, OPENAI_API_KEY, PASSCODE) are NOT stored here.
# Add them in the Cloudflare dashboard under the Worker's Settings > Variables and Secrets.

# Optional memory across restarts: create a KV namespace, paste its id, then remove the leading #.
# [[kv_namespaces]]
# binding = "JARVIS_KV"
# id = "PASTE_KV_NAMESPACE_ID"

# Optional, NOT secret: model names and safety limits. Remove the leading # to change a value.
# See .env.example for what each one does.
# [vars]
# CLAUDE_MODEL = "claude-sonnet-5-5"
# OPENAI_MODEL = "gpt-4o"
# MAX_SUBTASKS = "4"
# MAX_MODEL_CALLS = "12"
# CALL_TIMEOUT_SECONDS = "25"
# LOGIN_MAX_FAILURES = "5"
# LOGIN_WINDOW_SECONDS = "900"
