# Cloudflare-dəki Worker adı ilə eyni olmalıdır (Workers Builds preview bu ada görə hədəfi tapır).
name = "jarvis-avtomat"
main = "worker.js"
compatibility_date = "2026-09-01"

# Dashboard-da əl ilə yazılmış GİZLİ OLMAYAN dəyişənləri (TELEGRAM_ALLOWED_CHAT_IDS, SHOPIFY_STORE_DOMAIN və s.) hər deploy-da silməsin.
# Rəsmi sənəd: "Whether Wrangler should keep variables configured in the dashboard on deploy". Secret-lər bu ayardan asılı olmayaraq qorunur.
keep_vars = true

# Cloudflare Worker Previews (budaq/PR build-ləri) bu bloku tələb edir (sənədə görə boş ola bilər).
# Boş blok: preview production ilə eyni ayarları alır, ayrıca ayar yoxdur.
[previews]

# Secrets (ANTHROPIC_API_KEY, OPENAI_API_KEY, PASSCODE) are NOT stored here.
# Add them in the Cloudflare dashboard under the Worker's Settings > Variables and Secrets.

# KV yaddaş (təsdiq qeydləri, bilik bazası, öyrənmə, lead-lər və Telegram təkrar-qorunması üçün; yoxdursa yaddaş yalnız cari prosesdə qalır).
# Namespace ID-ni UYDURMAQ OLMAZ. Real ID yalnız Cloudflare hesabında namespace yaradılandan sonra alınır (bax docs/KV_SETUP.md):
#   1) npx wrangler kv namespace create JARVIS_KV     (və ya Dashboard > Storage & Databases > KV > Create)
#   2) çıxışdakı 32 simvollu id-ni aşağıya yaz, 3 sətirdəki "#" işarələrini sil, commit et.
# ID yazılmamış bu blok açılarsa deploy uğursuz olur, ona görə şərhdə saxlanılır.
# [[kv_namespaces]]
# binding = "JARVIS_KV"
# id = "PASTE_KV_NAMESPACE_ID"

# Optional, NOT secret: model names and safety limits. Remove the leading # to change a value.
# See .env.example for what each one does.
# [vars]
# CLAUDE_MODEL = "claude-sonnet-5-5"
# OPENAI_MODEL = "gpt-4o"
# MAX_SUBTASKS = "4"
# MAX_MODEL_CALLS = "12"
# CALL_TIMEOUT_SECONDS = "25"
# LOGIN_MAX_FAILURES = "5"
# LOGIN_WINDOW_SECONDS = "900"
