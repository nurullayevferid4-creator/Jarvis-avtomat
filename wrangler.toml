# Cloudflare-dəki Worker adı ilə eyni olmalıdır (Workers Builds preview bu ada görə hədəfi tapır).
name = "jarvis-avtomat"
main = "worker.js"
compatibility_date = "2026-09-01"

# Cloudflare Worker Previews (budaq/PR build-ləri) bu bloku tələb edir (sənədə görə boş ola bilər).
# Boş blok: preview production ilə eyni ayarları alır, ayrıca ayar yoxdur.
[previews]

# Secrets (ANTHROPIC_API_KEY, OPENAI_API_KEY, PASSCODE and all social secrets listed in .env.example) are NOT stored here.
# Add them in the Cloudflare dashboard under the Worker's Settings > Variables and Secrets.

# Yaddaş (təsdiqlər, tokenlər, audit). Namespace ID gizli məlumat deyil; namespace Fərid-in hesabında "jarvis-kv" adı ilə yaradılıb.
[[kv_namespaces]]
binding = "JARVIS_KV"
id = "b2724230925a48289e16d82ae5403009"

# Media anbarı (Instagram/TikTok/YouTube üçün video/şəkil). Bucket "jarvis-r2" Fərid-in hesabında mövcuddur.
# Bucket İCTİMAİ OLMAMALIDIR: media yalnız imzalı müvəqqəti ünvanla (/media/...) verilir.
[[r2_buckets]]
binding = "JARVIS_MEDIA"
bucket_name = "jarvis-r2"

# Koordinator (Durable Object): təsdiq/icra kilidi və "bir dəfə" markeri. KV-də atomik yazma olmadığı üçün lazımdır.
# Resurs yaratmaq tələb etmir, ilk deploy zamanı özü yaranır.
[[durable_objects.bindings]]
name = "COORD"
class_name = "JarvisCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JarvisCoordinator"]

# Gözləyən paylaşım işlərini hər 5 dəqiqədən bir irəlilədir və Instagram tokenini vaxtında yeniləyir.
# Yalnız təsdiq verilmiş işlərə toxunur; təsdiq yoxdursa heç nə etmir.
[triggers]
crons = ["*/5 * * * *"]

# Optional, NOT secret: model names and safety limits. Remove the leading # to change a value.
# See .env.example for what each one does.
# [vars]
# CLAUDE_MODEL = "claude-sonnet-5-5"
# OPENAI_MODEL = "gpt-4o"
# PUBLIC_BASE_URL = "https://jarvis-avtomat.<account>.workers.dev"   # NOT secret; OAuth callback + media URL base
# INSTAGRAM_API_VERSION = "v25.0"
# MAX_SUBTASKS = "4"
# MAX_MODEL_CALLS = "12"
# CALL_TIMEOUT_SECONDS = "25"
# LOGIN_MAX_FAILURES = "5"
# LOGIN_WINDOW_SECONDS = "900"
