<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Inter,"Noto Color Emoji",sans-serif}
#cam{position:absolute;inset:0;transform-origin:0 0}
#sub{position:absolute;left:30px;right:30px;top:1500px;text-align:center}
#who{display:inline-block;font-size:36px;font-weight:900;padding:6px 22px;border-radius:30px;color:#fff;margin-bottom:14px}
#line{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 0}
#line span{font-size:70px;font-weight:900;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 6px 0 #000;margin:0 20px;display:inline-block}
#line span.on{color:#ffd54a}
#chip{position:absolute;top:80px;left:50%;transform:translateX(-50%);font-size:34px;font-weight:900;background:#2E9E5B;color:#fff;padding:12px 34px;border-radius:40px;white-space:nowrap;box-shadow:0 6px 0 #1F7442}
#burst{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:130px;font-weight:900;color:#ffd54a;-webkit-text-stroke:6px #1F7442;paint-order:stroke fill;letter-spacing:-2px;opacity:0;line-height:1}
#bub{position:absolute;left:560px;top:1290px;background:#fff;color:#222;font-size:64px;font-weight:900;padding:18px 34px;border-radius:40px;opacity:0}
#end{position:absolute;inset:0;background:#2E9E5B;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style><script src="../rig.js"></script></head><body>
<svg id="cam" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EC8F2"/><stop offset=".6" stop-color="#FCE2B6"/></linearGradient></defs>
  <rect x="-600" width="2400" height="1920" fill="url(#sky)"/>
  <circle cx="860" cy="330" r="90" fill="#FFE9A6"/>
  <g fill="#B9C7D6" opacity=".9" id="city"></g>
  <g fill="#93A7BD" id="city2"></g>
  <rect x="-600" y="1380" width="2400" height="540" fill="#C9B79A"/><rect x="-600" y="1380" width="2400" height="24" fill="#AE9A7B"/>
  <g id="tiles"></g>
  <g id="R"></g><g id="V"></g><g id="B"></g>
</svg>
<div id="chip">VAQİF HESABLAYIR · tanışlıq</div>
<div id="burst">GƏL<br>HESABLAYAQ!</div>
<div id="bub">mə-ə! 🔔</div>
<div id="sub"><div id="who"></div><div id="line"></div></div>
<div id="end"><div style="font-size:150px">🧮</div><div style="font-size:110px;font-weight:900;letter-spacing:-2px;text-align:center;line-height:1.05">VAQİF<br>HESABLAYIR</div><div style="font-size:48px;font-weight:800;margin-top:40px;background:#fff;color:#2E9E5B;padding:14px 36px;border-radius:40px">1-ci bölüm tezliklə</div></div>
<div id="flash"></div>
<script>
const LIP=__LIP__, FPS=30, TOTAL=19.5;
// city silhouettes (generic)
(()=>{let s='',s2='';let x=-400,i=0;while(x<1700){const w=70+((i*37)%60),h=180+((i*53)%220);s+=`<rect x="${x}" y="${1380-h-120}" width="${w}" height="${h+120}"/>`;x+=w+8;i++}
 x=-420;i=3;while(x<1700){const w=90+((i*29)%70),h=120+((i*41)%160);s2+=`<rect x="${x}" y="${1380-h}" width="${w}" height="${h}" rx="6"/>`;for(let wy=1380-h+20;wy<1370;wy+=40)for(let wx=x+14;wx<x+w-20;wx+=30)s2+=`<rect x="${wx}" y="${wy}" width="14" height="20" fill="#C8D6E4"/>`;x+=w+14;i++}
 document.getElementById('city').innerHTML=s;document.getElementById('city2').innerHTML=s2;
 let t='';for(let k=-6;k<20;k++)t+=`<path d="M${k*110-200} 1920 L${k*110+40} 1404" stroke="#B8A585" stroke-width="4"/>`;document.getElementById('tiles').innerHTML=t})();
const W={ramin:[["Vaqif,",0.1,0.6],["qoyun?",1.1,1.4],["Ciddisən?",1.9,2.4],["Mən",3.1,3.4],["artıq",3.4,3.8],["yeni",3.8,4.1],["iPhone",4.1,4.5],["aldım!",4.5,4.9]],
 vaqif:[["Salam,",0.6,1.2],["mən",1.3,1.6],["Vaqifəm.",1.6,2.3],["Hamı",2.9,3.2],["əvvəlcə",3.2,3.8],["alır,",3.8,4.2],["sonra",4.5,5.0],["fikirləşir.",5.0,5.7],["Mən",6.5,6.7],["isə",6.7,7.0],["əvvəlcə",7.4,7.9],["hesablayıram.",7.9,8.7]],
 catch:[["Gəl",0.4,0.75],["hesablayaq!",0.8,1.6]]};
const LINES=[{who:'RAMİN',col:'#4A5BD6',off:0.7,w:W.ramin,chunk:3},{who:'VAQİF',col:'#2E9E5B',off:6.1,w:W.vaqif,chunk:3},{who:'VAQİF',col:'#2E9E5B',off:14.6,w:W.catch,chunk:3}];
const cl=x=>Math.min(Math.max(x,0),1),ease=x=>1-Math.pow(1-cl(x),3),eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=cl(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const blinkAt=(t,seed)=>{const p=(t+seed)%3.7;return p<0.12?Math.sin(p/0.12*Math.PI):0};
const lerp=(a,b,p)=>a+(b-a)*p;
function cam(t){ // [scale, cx, cy] focus
  const keys=[[0,1.04,540,1010],[5.8,1.04,540,1010],[6.4,1.5,770,1118],[14.3,1.55,770,1110],[14.6,2.1,770,985],[16.6,2.1,770,985],[17.0,1,540,1000],[19.5,1,540,1000]];
  for(let i=0;i<keys.length-1;i++){const[a,s1,x1,y1]=keys[i],[b,s2,x2,y2]=keys[i+1];if(t>=a&&t<=b){const p=eio((t-a)/(b-a));return[lerp(s1,s2,p),lerp(x1,x2,p),lerp(y1,y2,p)]}}
  return[1,540,1000]}
const EV=[{t:6.0,k:'whoosh'},{t:14.45,k:'riser'},{t:15.0,k:'boom'},{t:16.75,k:'pop'},{t:16.95,k:'whoosh'},{t:17.6,k:'ding'}];
window.EVENTS=EV; window.TOTAL=TOTAL;
window.render=function(t){
  const f=Math.min(Math.round(t*FPS),LIP.ramin.length-1);
  // camera
  const [s,cx,cy]=cam(t); let sh=0;[15.0].forEach(x=>{const d=t-x;if(d>0&&d<0.4)sh+=(1-d/0.4)*18});
  document.getElementById('cam').style.transform=`translate(${540-cx*s+Math.sin(t*90)*sh}px,${1000-cy*s+Math.cos(t*70)*sh}px) scale(${s})`;
  // RAMIN (left)
  const rTalk=t>0.7&&t<5.8, rIn=ease((t-0.1)/0.6);
  let rExpr=rTalk?'laugh':(t>15?'surprised':'smug');
  const rArm=rTalk?-35-Math.abs(Math.sin(t*5))*35:-30;
  document.getElementById('R').innerHTML=`<g transform="translate(${lerp(-560,-10,rIn)} ${640+Math.abs(Math.sin(t*3))*(rTalk?6:2)}) scale(1.25)">${ramin({expr:rExpr,mouth:LIP.ramin[f],armR:rArm,bob:rTalk?Math.sin(t*9)*3:0,glasses:t<15})}</g>`;
  // VAQIF (right)
  const lt=t-6.1; let vExpr='smug', look=[-1,0], armR=-8, armL=8;
  if(t<1.2) vExpr='neutral';
  if(t>=6.1&&lt<2.6){vExpr='happy';look=[0,0]}
  else if(lt>=2.6&&lt<6.2){vExpr='thinking';look=[1,-1]}
  else if(lt>=6.2&&t<14.6){vExpr='smug';look=[0,0];armR=lerp(-8,-150,ease((lt-6.4)/0.5))}
  if(t>=14.6&&t<16.9){vExpr=(LIP.vaqif[f]==='X')?'laugh':'happy';look=[0,0];armR=-160+Math.sin(t*10)*10;armL=40}
  if(t>=16.9){vExpr='happy';armR=-150}
  const vTalk=LIP.vaqif[f]!=='X';
  document.getElementById('V').innerHTML=`<g transform="translate(520 ${640+(vTalk?Math.abs(Math.sin(t*7))*5:0)}) scale(1.25)">${vaqif({expr:vExpr,mouth:LIP.vaqif[f],blink:blinkAt(t,0.5),look,armR,armL,bob:vTalk?Math.sin(t*8)*3:0})}</g>`;
  // BƏBƏ
  const bp=(t-16.6)/0.45;
  document.getElementById('B').innerHTML=t>16.5?`<g transform="translate(330 ${lerp(1960,1250,back(bp))}) scale(0.75)">${baba({bleat:t>16.8&&t<17.6?Math.abs(Math.sin((t-16.8)*8)):0,look:[-1,0],blink:blinkAt(t,1.3)})}</g>`:'';
  const bub=document.getElementById('bub');bub.style.opacity=t>16.85&&t<17.9?1:0;bub.style.transform=`scale(${back((t-16.85)/0.3)})`;
  // burst text
  const bu=document.getElementById('burst');bu.style.opacity=t>15.0&&t<16.7?1:0;bu.style.transform=`scale(${lerp(2.2,1,ease((t-15.0)/0.22))}) rotate(-4deg)`;
  document.getElementById('flash').style.opacity=Math.max(t>15&&t<15.15?(1-(t-15)/0.15)*0.5:0,t>16.95&&t<17.15?(1-(t-16.95)/0.2)*0.6:0);
  document.getElementById('chip').style.opacity=t<5.8?1:0;
  // end card
  const ec=document.getElementById('end');ec.style.opacity=cl((t-17.0)/0.2);ec.style.clipPath=`circle(${ease((t-17.0)/0.45)*150}% at 70% 75%)`;
  // captions
  const who=document.getElementById('who'),line=document.getElementById('line');line.innerHTML='';who.style.opacity=0;
  for(const L of LINES){const lt=t-L.off;const last=L.w[L.w.length-1][2];if(lt<0||lt>last+0.35)continue;
    who.textContent=L.who;who.style.background=L.col;who.style.opacity=1;
    const ch=[];let c=[];L.w.forEach(w=>{c.push(w);if(c.length>=L.chunk||/[.!?,]$/.test(w[0])&&c.length>=2){ch.push(c);c=[]}});if(c.length)ch.push(c);
    let ci=0;ch.forEach((c,k)=>{if(lt>=c[0][1]-0.1)ci=k});
    ch[ci].forEach(w=>{const sp=document.createElement('span');sp.textContent=w[0];if(lt>=w[1]-0.05&&lt<w[2]+0.1)sp.className='on';sp.style.opacity=lt>=w[1]-0.1?1:0.4;line.appendChild(sp)})}
};
render(0);
</script></body></html>
